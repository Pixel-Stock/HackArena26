apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-final-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-cd-final-project
  template:
    metadata:
      labels:
        app: ci-cd-final-project
    spec:
      containers:
        - name: application
          image: image-registry.openshift-image-registry.svc:5000/PROJECT/ci-cd-final-project:latest
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-final-project
spec:
  selector:
    app: ci-cd-final-project
  ports:
    - name: http
      port: 8000
      targetPort: 8000
